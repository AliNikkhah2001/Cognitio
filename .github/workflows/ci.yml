name: Cognitio core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install ruff
      - name: Lint minimum core
        run: ruff check cognitio tests/unit/test_cognitio_service.py
      - name: Check formatting
        run: ruff format --check cognitio tests/unit/test_cognitio_service.py
      - name: Run minimum-core tests
        run: python -m unittest discover -s tests/unit -p "test_cognitio_service.py" -v
